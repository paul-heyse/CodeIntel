site_name: CodeIntel
site_url: https://example.com/codeintel-docs
repo_url: https://github.com/your-org/codeintel
repo_name: codeintel

# docs live inside mkdocs-build/docs
docs_dir: docs

# built site goes to mkdocs-output at repo root
site_dir: ../mkdocs-output

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.tabs
    - navigation.indexes
    - content.code.copy
    - search.suggest
    - search.highlight
    - search.share

markdown_extensions:
  - toc:
      permalink: "#"
  - admonition
  - attr_list
  - def_list
  - footnotes

  # Pymdown extensions for tabs, details, fenced code, etc.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      default_lang: python
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Overview: index.md
  - Guide: guide.md
  - Architecture:
      - architecture/overview.md
      - architecture/layering.md
      - architecture/datasets-and-snapshots.md
      - architecture/ingestion.md
      - architecture/analytics.md
      - architecture/graphs.md
      - architecture/storage.md
      - architecture/serving.md
      - architecture/pipeline.md
      - architecture/runtime.md

  # Code reference nav is generated automatically in docs/reference/SUMMARY.md
  - Code Reference: reference/

plugins:
  - search

  # Generate API reference pages + literate nav from src/ at build time
  - gen-files:
      scripts:
        - ../mkdocs_gen/gen_ref_pages.py

  # Use SUMMARY.md files for nav in subtrees (e.g. docs/reference/)
  - literate-nav:
      nav_file: SUMMARY.md

  # Make section headings clickable and show __init__ docs as section index
  - section-index

  # Cross-page links by heading title
  - autorefs

  # Auto API docs from Python code
  - mkdocstrings:
      watch:
        - ../src
      default_handler: python
      handlers:
        python:
          # where to look for modules
          paths:
            - ../src

          # cross-ref external docs
          inventories:
            - https://docs.python.org/3/objects.inv

          options:
            # docstring / type handling (NumPy style)
            docstring_style: numpy
            docstring_section_style: table
            show_signature: true
            show_signature_annotations: true
            modernize_annotations: true
            unwrap_annotated: true

            # head / TOC behavior
            show_root_heading: true
            show_root_full_path: true
            show_root_toc_entry: true
            show_symbol_type_heading: true
            heading_level: 2

            # member selection & order
            members_order: source
            inherited_members: true
            filters:
              - "!^_"

            # docstring sections
            show_docstring_description: true
            show_docstring_parameters: true
            show_docstring_returns: true
            show_docstring_raises: true
            show_docstring_attributes: true
            show_docstring_examples: true

            show_if_no_docstring: false

  # Optional: run small scripts in code blocks
  - markdown-exec
