[project]
name = "codeintel-hello-pack"
version = "0.1.0"
description = "Example CodeIntel target pack."
requires-python = ">=3.11"
dependencies = ["codeintel"]

[project.entry-points."codeintel.target_packs"]
hello-pack = "hello_pack.plugin:target_pack"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["hello_pack*"]
