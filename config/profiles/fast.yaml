profile:
  name: fast
  description: "Quick iteration profile for local development"
  version: "1.0.0"

shared: {}

plugins:
  graphs.callgraph:
    use_libcst: false
    resolve_imports: false
    include_external_calls: false

  graphs.import_graph:
    include_stdlib: false
    include_third_party: false

  graphs.cpg:
    enable_reaches: false

  ingest.scip_python:
    include_references: false
    include_implementations: false
    timeout_seconds: 120

  ingest.modules:
    include_tests: false

  ingestion.symtable:
    enable: true
    batch_size: 5000

  ingestion.bytecode:
    enable: false
    include_cfg: false
    include_defuse: false
    batch_size: 5000
    max_workers: 1

  ingestion.inspect:
    enable: false
    module_allowlist: []
    batch_size: 5000
