    exit_code: 0
    snapshot: "pr22_plan_call_graph_views.json"
    kind: "text"

  # ========================================================================
  # PR-23: Export Targets - JSONL and Parquet
  # ========================================================================

  - name: "pr23_plan_export_jsonl_native"
    tags: ["pr23", "plan", "native", "json", "export", "tiny"]
    args: ["build", "plan", "export_jsonl", "--format", "json", "--help"]
    exit_code: 0
    snapshot: "pr23_plan_export_jsonl_native.json"
