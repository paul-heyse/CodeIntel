# CLI Golden Snapshot Manifest for Hamilton Phase 2
#
# This manifest defines CLI commands to test and their expected outputs.
# Snapshots are validated during CI and can be updated with --update-cli-snapshots.
#
# Tag taxonomy:
#   - PR tags: prNN (e.g., pr08, pr23, pr52, pr55)
#   - Phase tags: phaseN (e.g., phase4)
#   - Command tags: graph, plan, explain, history, status, run, assets, lineage, promote, resolve, diff
#   - Format tags: json, dot, mermaid, text
#   - Scope tags: tiny, integration
#   - Mode tags: generated, native
#   - Domain tags: analytics, graphs, export

app_import: "codeintel.cli:app"

defaults:
  kind: "json"
  output: "stdout"
  exit_code: 0
  env:
    CODEINTEL_LOG_LEVEL: "WARNING"

cases:
  # ========================================================================
  # PR-16: Contract Parity - Verify complete contracts for key targets
  # ========================================================================

  - name: "pr16_plan_function_metrics_contract"
    tags: ["pr16", "plan", "json", "tiny"]
    args: ["build", "plan", "function_metrics", "--format", "json", "--help"]
    exit_code: 0
    snapshot: "pr16_plan_function_metrics_contract.json"
    kind: "text"

  - name: "pr16_plan_risk_factors_contract"
    tags: ["pr16", "plan", "json", "tiny"]
    args: ["build", "plan", "risk_factors", "--format", "json", "--help"]
    exit_code: 0
    snapshot: "pr16_plan_risk_factors_contract.json"
    kind: "text"

  # ========================================================================
  # PR-21: Native Analytics Targets - coverage_functions, hotspots, subsystems
  # ========================================================================

  - name: "pr21_plan_coverage_functions_native"
    tags: ["pr21", "plan", "native", "json", "analytics", "tiny"]
    args: ["build", "plan", "coverage_functions", "--format", "json", "--help"]
    exit_code: 0
    snapshot: "pr21_plan_coverage_functions_native.json"
    kind: "text"

  - name: "pr21_plan_hotspots_native"
    tags: ["pr21", "plan", "native", "json", "analytics", "tiny"]
    args: ["build", "plan", "hotspots", "--format", "json", "--help"]
