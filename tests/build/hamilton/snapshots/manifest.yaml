    args: ["build", "plan", "export_parquet", "--format", "json", "--help"]
    exit_code: 0
    snapshot: "pr23_plan_export_parquet_native.json"
    kind: "text"

  # ========================================================================
  # PR-08: Hamilton Default Mode - Verify generated mode is default
  # ========================================================================

  - name: "pr08_graph_default_mode"
    tags: ["pr08", "graph", "json", "generated", "tiny"]
    args: ["build", "graph", "modules", "--format", "json", "--help"]
    # Using --help to get predictable output without needing full runtime
    exit_code: 0
    snapshot: "pr08_graph_help.json"
    kind: "text"

  # ========================================================================
  # PR-09: Build Planner - Plan command functionality
  # ========================================================================

  - name: "pr09_plan_help"
    tags: ["pr09", "plan", "text", "tiny"]
    args: ["build", "plan", "--help"]
    exit_code: 0
