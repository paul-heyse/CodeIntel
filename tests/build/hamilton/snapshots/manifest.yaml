  # ========================================================================
  # PR-63: Schema manifest drift gate (native-only)
  # ========================================================================

  - name: "pr63_schema_manifest_native"
    tags: ["pr63", "schema", "native", "json", "integration"]
    args:
      [
        "build",
        "schema",
        "compile",
        "--only-native",
        "--infer-native",
        "--format",
        "json",
        "--stable",
      ]
