rules:
  - rule_id: py.entrypoints.importlib_metadata.group
    language: python
    config:
      rule:
        pattern: 'importlib.metadata.entry_points(group=$GROUP, $$$ARGS)'
      constraints:
        GROUP:
          regex: '^["'']'
  - rule_id: py.entrypoints.pkg_resources.iter
    language: python
    config:
      rule:
        pattern: 'pkg_resources.iter_entry_points(group=$GROUP, $$$ARGS)'
      constraints:
        GROUP:
          regex: '^["'']'
