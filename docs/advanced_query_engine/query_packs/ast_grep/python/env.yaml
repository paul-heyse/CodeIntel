rules:
- rule_id: py.env.getenv
  language: python
  config:
    rule:
      pattern: os.getenv($KEY, $$$ARGS)
    constraints:
      KEY:
        regex: ^["']
- rule_id: py.env.environ_get
  language: python
  config:
    rule:
      pattern: os.environ.get($KEY, $$$ARGS)
    constraints:
      KEY:
        regex: ^["']
- rule_id: py.env.environ_subscript
  language: python
  config:
    rule:
      pattern: os.environ[$KEY]
    constraints:
      KEY:
        regex: ^["']
