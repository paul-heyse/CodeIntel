receivers:
  otlp:
    protocols:
      grpc:
      http:

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  attributes:
    actions:
      - key: build.decision_trace_path
        action: delete
      - key: cli.arg_names
        action: delete
  resource:
    attributes:
      - key: deployment.environment.name
        action: insert
        value: "${CODEINTEL_DEPLOYMENT_ENVIRONMENT}"
  batch:
    send_batch_size: 512
    send_batch_max_size: 1024
    timeout: 5s
  tail_sampling:
    decision_wait: 10s
    num_traces: 10000
    expected_new_traces_per_sec: 1000
    policies:
      - name: error-traces
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow-traces
        type: latency
        latency:
          threshold_ms: 1000

connectors:
  spanmetrics:
    aggregation_temporality: "AGGREGATION_TEMPORALITY_DELTA"
    dimensions:
      - name: http.route
      - name: grpc.method

exporters:
  otlp:
    endpoint: "${OTEL_EXPORTER_OTLP_ENDPOINT}"
    tls:
      insecure: true
  logging:
    loglevel: info

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes, resource, tail_sampling, batch]
      exporters: [otlp, logging]
    metrics:
      receivers: [otlp, spanmetrics]
      processors: [memory_limiter, attributes, resource, batch]
      exporters: [otlp, logging]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes, resource, batch]
      exporters: [otlp, logging]
