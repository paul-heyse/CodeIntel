repo: github.com/paul-heyse/CodeIntel
default_profile: full
ingest:
  recipe: builtin.default
analytics:
  profile: full
graphs:
  recipe: builtin.full
storage:
  db_path: .codeintel/duckdb.db
hamilton:
  dynamic_execution:
    enabled: false
    local_executor: null
    remote_executor: null
    remote_max_tasks: null
  execution:
    parallel_backend: sequential
    max_workers: null
    materializers: []

# Iceberg guardrails (env-driven; see docs/runtime_environment.md)
# Defaults: prod => false, non-prod => true when catalog config is present.
# CODEINTEL_ICEBERG_READ_ENABLED=false
# CODEINTEL_ICEBERG_WRITE_ENABLED=false
# CODEINTEL_ICEBERG_TOMBSTONES_ENABLED=false
